openapi: 3.0.3

info:
  title: Order API
  version: 1.0.0

servers:
  - url: /api/v1

tags:
  - name: Orders

paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order created
          headers:
            Location:
              description: URL of the created order
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '400':
          description: Invalid request

  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order

      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '404':
          description: Order not found

components:
  schemas:

    CreateOrderRequest:
      type: object
      required:
        - lines
        - totalAmount
        - currency
        - paymentMethodReference

      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderLine'

        totalAmount:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          example: 49.90

        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: EUR

        paymentMethodReference:
          type: string
          minLength: 1
          example: pm_82f72ac

    CreateOrderLine:
      type: object
      required:
        - sku
        - quantity

      properties:
        sku:
          type: string
          minLength: 1
          example: SKU-001

        quantity:
          type: integer
          minimum: 1
          example: 2

    OrderResponse:
      type: object
      required:
        - id
        - status
        - lines
        - totalAmount
        - currency
        - createdAt

      properties:
        id:
          type: string
          format: uuid

        status:
          $ref: '#/components/schemas/OrderStatus'

        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineResponse'

        totalAmount:
          type: number

        currency:
          type: string

        createdAt:
          type: string
          format: date-time

    OrderLineResponse:
      type: object
      required:
        - sku
        - quantity

      properties:
        sku:
          type: string

        quantity:
          type: integer

    OrderStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - CANCELLED
