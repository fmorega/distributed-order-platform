spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:55440/order_db}
    username: ${ORDER_DB_USERNAME:order_user}
    password: ${ORDER_DB_PASSWORD:order_password}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  outbox:
    poll-delay-ms: 5000
    batch-size: 5

server:
  port: 8090
  servlet:
    context-path: /api/v1

